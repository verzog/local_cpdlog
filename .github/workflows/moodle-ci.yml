name: Moodle Plugin CI

# Private repo: run on pull requests and main only, never on a schedule, to save Actions minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Australia/Sydney

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        # MariaDB 11 images ship healthcheck.sh instead of mysqladmin.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Branch-aware: Moodle 5.2+ dropped PHP 8.2, so 8.2 is only tested on 5.0.
        # Static checks run on the lowest cell only (phplint must use the lowest PHP).
        include:
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql', static: true}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.4', database: 'mariadb', static: false}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql', static: false}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'mariadb', static: false}
          # Moodle 5.3 LTS; switch to MOODLE_503_STABLE and drop allow-failure once it exists.
          - {moodle-branch: 'main', php: '8.3', database: 'pgsql', static: false}

    continue-on-error: ${{ matrix.moodle-branch == 'main' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && matrix.static }}
        # The command defaults to the stock "moodle" standard; pass the plugin ruleset so the
        # Mode A licence overrides in .phpcs.xml apply.
        run: moodle-plugin-ci phpcs --standard ${{ github.workspace }}/plugin/.phpcs.xml --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() && matrix.static }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 3

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
