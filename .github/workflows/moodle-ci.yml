name: Moodle Plugin CI

# Private repo: run on pull requests and main only, never on a schedule, to save Actions minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Australia/Sydney

jobs:
  # One job per static check so each shows as its own line on the PR. They run on the lowest
  # supported Moodle and PHP, installing with --no-init to skip PHPUnit and Behat setup. The
  # installer still creates the Moodle database, so PostgreSQL is needed.
  static:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - {check: 'PHP Lint', command: 'phplint'}
          # Complexity warnings are advisory only.
          - {check: 'PHP Mess Detector', command: 'phpmd', advisory: true}
          # The command defaults to the stock "moodle" standard; pass the plugin ruleset so the
          # Mode A licence overrides in .phpcs.xml apply.
          - {check: 'Moodle Code Checker', command: 'phpcs --standard ${PHPCS_RULESET} --max-warnings 0'}
          - {check: 'Moodle PHPDoc Checker', command: 'phpdoc --max-warnings 0'}
          - {check: 'Validating', command: 'validate'}
          - {check: 'Check upgrade savepoints', command: 'savepoints'}
          - {check: 'Mustache Lint', command: 'mustache'}
          - {check: 'Grunt', command: 'grunt --max-lint-warnings 0'}

    continue-on-error: ${{ matrix.advisory == true }}

    env:
      # Not PLUGIN_DIR: moodle-plugin-ci reads that to locate the installed plugin.
      PHPCS_RULESET: ${{ github.workspace }}/plugin/.phpcs.xml

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_500_STABLE

      - name: ${{ matrix.check }}
        run: moodle-plugin-ci ${{ matrix.command }}

  # One job per test suite per Moodle/PHP/database cell.
  tests:
    name: ${{ matrix.suite }} (${{ matrix.cell.moodle-branch }}, PHP ${{ matrix.cell.php }}, ${{ matrix.cell.database }})
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        # MariaDB 11 images ship healthcheck.sh instead of mysqladmin.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        suite: ['PHPUnit', 'Behat']
        # Branch-aware: Moodle 5.2+ dropped PHP 8.2, so 8.2 is only tested on 5.0.
        cell:
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.4', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'mariadb'}
          # Moodle 5.3 LTS; switch to MOODLE_503_STABLE and drop allow-failure once it exists.
          - {moodle-branch: 'main', php: '8.3', database: 'pgsql'}

    continue-on-error: ${{ matrix.cell.moodle-branch == 'main' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.cell.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.cell.php }}
          extensions: sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.cell.database }}
          MOODLE_BRANCH: ${{ matrix.cell.moodle-branch }}

      - name: PHPUnit tests
        if: ${{ matrix.suite == 'PHPUnit' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ matrix.suite == 'Behat' }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 3

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat faildump (${{ matrix.cell.moodle-branch }}, ${{ matrix.cell.php }}, ${{ matrix.cell.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
